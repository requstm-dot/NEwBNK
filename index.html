<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мій Банк</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Мій Банк">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        @font-face { font-family: 'Manrope'; src: url('Manrope.ttf'); }
        @font-face { font-family: 'Manrope-Bold'; src: url('Manrope-Bold.ttf'); }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; color: white; overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        .container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 100%;
        }

        .editable { 
            position: absolute; border: none; background: transparent; 
            color: inherit; font-family: inherit; outline: none; white-space: nowrap; 
            min-width: 15px; min-height: 1.2em; display: inline-block;
            -webkit-user-select: text;
        }

        #warning_overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none; 
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .warning-box {
            background: #1c1c1e; padding: 25px; border-radius: 20px;
            width: 80%; max-width: 300px; text-align: center;
            border: 1px solid #333;
        }
        .warning-box h2 { font-size: 2vh; margin-bottom: 15px; color: #ff9500; }
        .warning-box p { font-size: 1.6vh; line-height: 1.4; color: #ccc; margin-bottom: 20px; }
        .warning-box button {
            background: #ff9500; border: none; padding: 12px 30px;
            color: white; border-radius: 10px; font-family: 'Manrope-Bold'; font-size: 1.6vh;
        }

        #profile_letter { left: 4.0%; top: 7.3%; font-family: 'Manrope-Bold'; font-size: 2.7vh; color: #cc7600; width: 4vh; height: 4vh; display: flex; align-items: center; justify-content: center; } 

        #card_digits { left: 16.5%; top: 32.3%; font-size: 1.8vh; }
        #card_date   { left: 32%; top: 32.3%; font-size: 1.8vh; }
        #balance { left: 50%; top: 38.8%; font-size: 2.3vh; transform: translateX(-50%); text-align: center; white-space: nowrap; }
        #balance span { font-size: 2vh; }

        /* Стилі для рядків "Кредитний ліміт" та "Власні кошти" */
        .sub-info-label { font-family: 'Manrope'; font-size: 1.5vh; color: #aaa; }
        .sub-info-val { font-family: 'Manrope-Bold'; font-size: 1.5vh; color: #fff; }
        .sub-info-container { position: absolute; display: flex; align-items: baseline; justify-content: flex-end; width: 45%; right: 7.5%; }

        #credit_limit_label { left: 10%; top: 45.2%; }
        #credit_limit_cont  { top: 45.2%; }

        #own_funds_label    { left: 10%; top: 48.5%; }
        #own_funds_cont     { top: 48.5%; }

        .uah { margin-left: 4px; color: inherit; }
    </style>
</head>
<body>
    <div id="warning_overlay">
        <div class="warning-box">
            <h2>УВАГА</h2>
            <p>Цей додаток створено виключно з навчальною та розважальною метою. Він не є реальним банком.</p>
            <button onclick="acceptWarning()">Я погоджуюсь</button>
        </div>
    </div>

    <div id="main_container" class="container" spellcheck="false">
        <div id="profile_letter" class="editable" contenteditable="true">P</div>

        <div id="card_digits" class="editable" contenteditable="true">8801</div>
        <div id="card_date"   class="editable" contenteditable="true">12 / 29</div>
        <div id="balance" class="editable" contenteditable="true">1<span>.00 UAH</span></div>

        <!-- Кредитний ліміт -->
        <div id="credit_limit_label" class="editable sub-info-label" contenteditable="true">Кредитний ліміт</div>
        <div id="credit_limit_cont" class="sub-info-container">
            <div id="credit_limit_val" class="editable sub-info-val" contenteditable="true">0.00</div>
        </div>

        <!-- Власні кошти -->
        <div id="own_funds_label" class="editable sub-info-label" contenteditable="true">Власні кошти</div>
        <div id="own_funds_cont" class="sub-info-container">
            <div id="own_funds_val" class="editable sub-info-val" contenteditable="true">1.00</div>
        </div>
    </div>

    <script>
        function acceptWarning() {
            document.getElementById('warning_overlay').style.display = 'none';
            localStorage.setItem('warningAccepted', 'true');
        }

        function saveData() {
            const data = {};
            document.querySelectorAll('.editable').forEach(el => {
                data[el.id] = el.innerHTML;
            });
            localStorage.setItem('bankSave', JSON.stringify(data));
        }

        function loadData() {
            if (localStorage.getItem('warningAccepted') !== 'true') {
                document.getElementById('warning_overlay').style.display = 'flex';
            }

            document.getElementById('main_container').style.backgroundImage = "url('photo.png?v=" + Date.now() + "')";

            const saved = localStorage.getItem('bankSave');
            if (saved) {
                const data = JSON.parse(saved);
                for (let id in data) {
                    const el = document.getElementById(id);
                    if (el) {
                        el.innerHTML = data[id];
                    }
                }
            }
        }

        window.addEventListener('load', loadData);

        document.querySelectorAll('.editable').forEach(input => {
            input.addEventListener('input', () => {
                saveData();
            });

            input.onpaste = function(e) {
                e.preventDefault();
                const text = (e.originalEvent || e).clipboardData.getData('text/plain');
                document.execCommand("insertHTML", false, text);
            };

            input.onblur = function() {
                if (this.innerText.trim() === "") {
                    this.innerHTML = "&nbsp;";
                    saveData();
                }
            };
        });

        window.oncontextmenu = (e) => { e.preventDefault(); return false; };
    </script>
</body>
</html>
